                                <h2 className="font-display text-3xl sm:text-4xl font-bold text-cream mt-2 mb-6">
                                    LIVE MUSIC NIGHTS
                                </h2>

                                </p>

                                <div className="bg-noir-card p-6 rounded-lg border border-white/5 space-y-3">

                                            <p className="font-display text-sm font-semibold text-cream">Start Time</p>
                                            <p className="text-xs text-cream/60">From 20:00 (8:00 PM) onwards</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

            const galleryImages = [
                {
                    title: "Main Bar & Counter",
                    subtitle: "Handcrafted cocktails & rare spirits",
                    image: "https://images.unsplash.com/photo-1514933651103-005eec06c04b?w=800&auto=format&fit=crop&q=80"
                },
                {
                    title: "Velvet Lounge Area",
                    subtitle: "Comfortable & private seating",
                    image: "https://images.unsplash.com/photo-1572116469696-31de0f17cc34?w=800&auto=format&fit=crop&q=80"
                },
                {
                    title: "Atmospheric Lighting",
                    subtitle: "Subtle warmth for great evenings",
                    image: "https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=800&auto=format&fit=crop&q=80"
                },
                {
                    title: "Exclusive Reserve Shelf",
                    subtitle: "Curated collection of aged whiskies",
                    image: "https://images.unsplash.com/photo-1527281400683-1aae777175f8?w=800&auto=format&fit=crop&q=80"
                }
            ];

            return (
                <section id="gallery" className="py-20 px-4 sm:px-6 lg:px-8 bg-noir">
                    <div className="max-w-7xl mx-auto">
                        <div className="text-center mb-12">
                            <span className="text-xs uppercase tracking-[0.25em] text-accent font-medium">The Atmosphere</span>
                            <h2 className="font-display text-4xl font-bold text-cream mt-2">
                                PUB INTERIOR
                            </h2>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {galleryImages.map((item, idx) => (
                                <div key={idx} className="group relative rounded-lg overflow-hidden border border-white/5 h-80">
                                    <img 
                                        src={item.image} 
                                        alt={item.title} 
                                        className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                                    />
                                    <div className="absolute inset-0 bg-gradient-to-t from-noir via-noir/30 to-transparent opacity-90 transition-opacity duration-300" />
                                    <div className="absolute bottom-0 left-0 right-0 p-6">
                                        <h3 className="font-display text-2xl font-semibold text-cream mb-1">{item.title}</h3>
                                        <p className="text-xs text-accent font-light uppercase tracking-widest">{item.subtitle}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // Atmosphere Video Banner Section
        const VideoBannerSection = () => {
            return (
                <section className="relative h-[480px] overflow-hidden border-y border-white/10">
                    <video
                        src="https://cdn.shopify.com/videos/c/o/v/d2d628b6c277444abaaba63cb7aaf00f.mp4"
                        autoPlay
                        loop
                        muted
                        playsInline
                        className="w-full h-full object-cover"
                    />
                    <div className="absolute inset-0 bg-gradient-to-r from-noir/90 via-noir/60 to-noir/90 flex items-center justify-center text-center p-6">
                        <div className="max-w-2xl">
                            <span className="text-xs uppercase tracking-[0.3em] text-accent font-medium">Feel The Vibe</span>
                            <h2 className="font-display text-3xl sm:text-5xl font-bold text-cream mt-2 mb-4">
                                EXPERIENCE THE NIGHT
                            </h2>
                            <p className="text-cream/70 text-xs sm:text-sm font-light tracking-wide leading-relaxed">
                                Dark ambient lighting, handcrafted drinks, and unforgettable conversations await you at NOIR PUB.
                            </p>
                        </div>
                    </div>
                </section>
            );
        };

        // Specials Section
        const SpecialsSection = () => {
            const specials = [
                {
                    name: 'NOIR Velvet Reserve',
                    description: 'Aged cognac, dark cacao liqueur, maraschino cherry, orange bitters.',
                    price: '$22.00',
                    image: 'https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?w=600&auto=format&fit=crop&q=80'
                },
                {
                    name: 'Midnight Elixir',
                    description: 'Blackberry gin, wild elderflower, lemon juice, prosecco splash.',
                    price: '$19.00',
                    image: 'https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=600&auto=format&fit=crop&q=80'
                },
                {
                    name: 'Golden Hour Whiskey',
                    description: 'Japanese whiskey, honey-ginger syrup, fresh lemon, crystal ice block.',
                    price: '$25.00',
                    image: 'https://images.unsplash.com/photo-1527281400683-1aae777175f8?w=600&auto=format&fit=crop&q=80'
                },
            ];

            return (
                <section id="specials" className="py-20 px-4 sm:px-6 lg:px-8 bg-noir-card border-t border-white/5">
                    <div className="max-w-7xl mx-auto">
                        <div className="text-center mb-12">
                            <span className="text-xs uppercase tracking-[0.25em] text-accent font-medium">House Specials</span>
                            <h2 className="font-display text-4xl font-bold text-cream mt-2">
                                SIGNATURE SPECIALS
                            </h2>
                        </div>

                        <div className="grid md:grid-cols-3 gap-6">
                            {specials.map((item, idx) => (
                                <div key={idx} className="bg-noir rounded-lg overflow-hidden border border-white/5 p-6 flex flex-col justify-between">
                                    <div>
                                        <div className="h-44 rounded overflow-hidden mb-4">
                                            <img src={item.image} alt={item.name} className="w-full h-full object-cover" />
                                        </div>
                                        <h3 className="font-display text-xl font-semibold text-accent mb-2">{item.name}</h3>
                                        <p className="text-cream/70 text-xs leading-relaxed font-light mb-4">{item.description}</p>
                                    </div>
                                    <div className="flex justify-between items-center pt-3 border-t border-white/10">
                                        <span className="text-xs uppercase tracking-widest text-cream/40">Exclusive</span>
                                        <span className="font-display text-lg font-bold text-accent">{item.price}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // Reservation Section
        const ReservationSection = () => {
            const [formData, setFormData] = useState({ name: '', phone: '', date: '', time: '', guests: '' });
            const [submitted, setSubmitted] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
                setTimeout(() => setSubmitted(false), 5000);
                setFormData({ name: '', phone: '', date: '', time: '', guests: '' });
            };

            return (
                <section id="reservation" className="py-20 px-4 sm:px-6 lg:px-8 bg-noir border-t border-white/5">
                    <div className="max-w-2xl mx-auto text-center">
                        <span className="text-xs uppercase tracking-[0.25em] text-accent font-medium">Book a Table</span>
                        <h2 className="font-display text-4xl font-bold text-cream mt-2 mb-8">
                            RESERVE A TABLE
                        </h2>

                        {submitted && (
                            <div className="p-4 mb-6 bg-burgundy/40 border border-burgundy rounded text-cream text-xs uppercase tracking-widest">
                                Reservation Request Received! We will contact you shortly.
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-4 text-left bg-noir-card p-8 rounded-lg border border-white/5">
                            <div className="grid sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-[10px] uppercase tracking-widest text-cream/70 mb-1">Full Name</label>
                                    <input
                                        type="text"
                                        required
                                        value={formData.name}
                                        onChange={(e) => setFormData({...formData, name: e.target.value})}
                                        placeholder="John Doe"
                                        className="w-full bg-noir border border-white/10 rounded p-3 text-cream text-sm focus:border-burgundy outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-[10px] uppercase tracking-widest text-cream/70 mb-1">Phone Number</label>
                                    <input
                                        type="tel"
                                        required
                                        value={formData.phone}
                                        onChange={(e) => setFormData({...formData, phone: e.target.value})}
                                        placeholder="+374 XX XXX XXX"
                                        className="w-full bg-noir border border-white/10 rounded p-3 text-cream text-sm focus:border-burgundy outline-none"
                                    />
                                </div>
                            </div>

                            <div className="grid sm:grid-cols-3 gap-4">
                                <div>
                                    <label className="block text-[10px] uppercase tracking-widest text-cream/70 mb-1">Date</label>
                                    <input
                                        type="date"
                                        required
                                        value={formData.date}
                                        onChange={(e) => setFormData({...formData, date: e.target.value})}
                                        className="w-full bg-noir border border-white/10 rounded p-3 text-cream text-sm focus:border-burgundy outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-[10px] uppercase tracking-widest text-cream/70 mb-1">Time</label>
                                    <select
                                        required
                                        value={formData.time}
                                        onChange={(e) => setFormData({...formData, time: e.target.value})}
                                        className="w-full bg-noir border border-white/10 rounded p-3 text-cream text-sm focus:border-burgundy outline-none"
                                    >
                                        <option value="">Select</option>
                                        <option value="18:00">6:00 PM</option>
                                        <option value="20:00">8:00 PM</option>
                                        <option value="22:00">10:00 PM</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-[10px] uppercase tracking-widest text-cream/70 mb-1">Guests</label>
                                    <input
                                        type="number"
                                        min="1"
                                        max="10"
                                        required
                                        value={formData.guests}
                                        onChange={(e) => setFormData({...formData, guests: e.target.value})}
                                        placeholder="2"
                                        className="w-full bg-noir border border-white/10 rounded p-3 text-cream text-sm focus:border-burgundy outline-none"
                                    />
                                </div>
                            </div>

                            <button type="submit" className="w-full btn-primary py-3.5 rounded font-bold text-xs tracking-[0.2em] uppercase mt-2">
                                Confirm Reservation
                            </button>
                        </form>
                    </div>
                </section>
            );
        };

        // Contact Section
        const ContactSection = () => {
            return (
                <section id="contact" className="py-16 px-4 sm:px-6 lg:px-8 bg-noir-card border-t border-white/5">
                    <div className="max-w-7xl mx-auto">
                        <div className="grid md:grid-cols-3 gap-6 text-center">
                            <div className="border border-white/5 p-6 rounded bg-noir">
                                <div className="text-accent font-display text-lg font-bold mb-1">LOCATION</div>
                                <p className="text-cream/70 text-xs leading-relaxed font-light">123 Mashtots Avenue<br />Yerevan, Armenia</p>
                            </div>
                            <div className="border border-white/5 p-6 rounded bg-noir">
                                <div className="text-accent font-display text-lg font-bold mb-1">HOURS</div>
                                <p className="text-cream/70 text-xs leading-relaxed font-light">Mon - Sun: 5:00 PM - 2:00 AM</p>
                            </div>
                            <div className="border border-white/5 p-6 rounded bg-noir">
                                <div className="text-accent font-display text-lg font-bold mb-1">CONTACT</div>
                                <p className="text-cream/70 text-xs leading-relaxed font-light">+374 10 123456<br />info@noirpub.am</p>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // Footer Component
        const Footer = () => {
            return (
                <footer className="bg-noir border-t border-white/5 py-8 px-4 text-center text-cream/40 text-xs tracking-widest uppercase">
                    <div className="max-w-7xl mx-auto space-y-2">
                        <p className="font-display text-lg font-bold text-cream">NOIR PUB</p>
                        <p className="text-[10px] text-cream/50">Good Drinks • Great Nights</p>
                        <p className="pt-2 text-[9px]">&copy; {new Date().getFullYear()} NOIR PUB. All Rights Reserved.</p>
                    </div>
                </footer>
            );
        };

        // Main App Component
        const App = () => {
            const handleReserveClick = () => {
                const element = document.getElementById('reservation');
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                }
            };

            return (
                <div>
                    <Navigation onReserveClick={handleReserveClick} />
                    <HeroSection onReserveClick={handleReserveClick} />
                    <MenuSection />
                    <AboutSection />
                    <LiveMusicSection />
                    <InteriorGallery />
                    <VideoBannerSection />
                    <SpecialsSection />
                    <ReservationSection />
                    <ContactSection />
                    <Footer />
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
