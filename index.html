<!DOCTYPE html>
<html lang="en">
<head>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<body>
    <div id="root"></div>

    <script type="text/babel">

                return () => window.removeEventListener('scroll', handleScroll);

                { href: '#menu', label: 'Menu' },
                { href: '#about', label: 'About' },
                { href: '#specials', label: 'Specials' },
                { href: '#contact', label: 'Contact' },
            ];

            return (
                <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-500 ${
                    scrolled ? 'bg-glass border-b border-gold/20 py-3' : 'bg-transparent py-6'

                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center">
                            
                            {/* Premium Logo Header */}

                                <div className="w-10 h-10 border border-gold/60 rotate-45 flex items-center justify-center transition-transform duration-500 group-hover:rotate-180 bg-burgundy/30">

                                    <a
                                        key={link.href}
                                        href={link.href}
                                        className="text-sm uppercase tracking-[0.2em] text-cream/80 hover:text-gold transition-colors duration-300 font-medium"

                                        {link.label}
                                    </a>

                                        </div>
                                        <h3 className="font-display text-2xl font-semibold text-gold mb-3">{item.name}</h3>
                                        <p className="text-cream/70 text-xs leading-relaxed font-light mb-6">{item.description}</p>
                                    </div>
                                    <div className="flex justify-between items-center pt-4 border-t border-gold/15">
                                        <span className="text-xs uppercase tracking-widest text-cream/50">Exclusive</span>
                                        <span className="font-cinzel text-xl font-bold text-gold">{item.price}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // Reservation Section
        const ReservationSection = () => {
            const [formData, setFormData] = useState({ name: '', phone: '', date: '', time: '', guests: '' });
            const [submitted, setSubmitted] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
                setTimeout(() => setSubmitted(false), 5000);
                setFormData({ name: '', phone: '', date: '', time: '', guests: '' });
            };

            return (
                <section id="reservation" className="py-24 px-4 sm:px-6 lg:px-8 bg-gradient-to-t from-noir via-burgundy/20 to-noir border-t border-gold/20">
                    <div className="max-w-3xl mx-auto text-center">
                        <span className="text-xs uppercase tracking-[0.3em] text-gold font-medium">Reserve Your Place</span>
                        <h2 className="font-display text-4xl sm:text-5xl font-semibold text-cream mt-2 mb-4">
                            TABLE RESERVATION
                        </h2>
                        <p className="text-cream/60 text-xs tracking-widest uppercase mb-12">Reservations recommended for weekend evenings</p>

                        {submitted && (
                            <div className="p-4 mb-8 bg-gold/20 border border-gold text-gold text-xs uppercase tracking-widest">
                                Reservation Request Received. We will confirm via SMS shortly.
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-6 text-left border border-gold/20 p-8 sm:p-12 bg-noir/80 backdrop-blur-md">
                            <div className="grid sm:grid-cols-2 gap-6">
                                <div>
                                    <label className="block text-[11px] uppercase tracking-widest text-gold mb-2">Full Name</label>
                                    <input
                                        type="text"
                                        required
                                        value={formData.name}
                                        onChange={(e) => setFormData({...formData, name: e.target.value})}
                                        placeholder="Alexander Wright"
                                        className="w-full bg-noir border border-gold/20 p-3 text-cream text-sm focus:border-gold outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-[11px] uppercase tracking-widest text-gold mb-2">Phone Number</label>
                                    <input
                                        type="tel"
                                        required
                                        value={formData.phone}
                                        onChange={(e) => setFormData({...formData, phone: e.target.value})}
                                        placeholder="+1 (555) 000-0000"
                                        className="w-full bg-noir border border-gold/20 p-3 text-cream text-sm focus:border-gold outline-none"
                                    />
                                </div>
                            </div>

                            <div className="grid sm:grid-cols-3 gap-6">
                                <div>
                                    <label className="block text-[11px] uppercase tracking-widest text-gold mb-2">Date</label>
                                    <input
                                        type="date"
                                        required
                                        value={formData.date}
                                        onChange={(e) => setFormData({...formData, date: e.target.value})}
                                        className="w-full bg-noir border border-gold/20 p-3 text-cream text-sm focus:border-gold outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-[11px] uppercase tracking-widest text-gold mb-2">Time</label>
                                    <select
                                        required
                                        value={formData.time}
                                        onChange={(e) => setFormData({...formData, time: e.target.value})}
                                        className="w-full bg-noir border border-gold/20 p-3 text-cream text-sm focus:border-gold outline-none"
                                    >
                                        <option value="">Select Time</option>
                                        <option value="18:00">6:00 PM</option>
                                        <option value="20:00">8:00 PM</option>
                                        <option value="22:00">10:00 PM</option>
                                        <option value="00:00">12:00 AM</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-[11px] uppercase tracking-widest text-gold mb-2">Guests</label>
                                    <input
                                        type="number"
                                        min="1"
                                        max="10"
                                        required
                                        value={formData.guests}
                                        onChange={(e) => setFormData({...formData, guests: e.target.value})}
                                        placeholder="2"
                                        className="w-full bg-noir border border-gold/20 p-3 text-cream text-sm focus:border-gold outline-none"
                                    />
                                </div>
                            </div>

                            <button type="submit" className="w-full btn-gold py-4 font-bold text-xs tracking-[0.25em] uppercase mt-4">
                                Confirm Reservation
                            </button>
                        </form>
                    </div>
                </section>
            );
        };

        // Contact Section
        const ContactSection = () => {
            return (
                <section id="contact" className="py-24 px-4 sm:px-6 lg:px-8 bg-noir border-t border-gold/15">
                    <div className="max-w-7xl mx-auto">
                        <div className="grid md:grid-cols-3 gap-8 text-center">
                            <div className="border border-gold/15 p-8 bg-burgundy/5">
                                <div className="text-gold font-cinzel text-xl font-bold mb-2">LOCATION</div>
                                <p className="text-cream/70 text-xs leading-relaxed font-light">458 Northern Avenue<br />Downtown District, City</p>
                            </div>
                            <div className="border border-gold/15 p-8 bg-burgundy/5">
                                <div className="text-gold font-cinzel text-xl font-bold mb-2">HOURS</div>
                                <p className="text-cream/70 text-xs leading-relaxed font-light">Mon - Sun: 5:00 PM - 3:00 AM<br />Kitchen Open Until 1:30 AM</p>
                            </div>
                            <div className="border border-gold/15 p-8 bg-burgundy/5">
                                <div className="text-gold font-cinzel text-xl font-bold mb-2">CONTACT</div>
                                <p className="text-cream/70 text-xs leading-relaxed font-light">+1 (800) 555-NOIR<br />concierge@noirpub.com</p>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // Footer Component
        const Footer = () => {
            return (
                <footer className="bg-noir border-t border-gold/20 py-12 px-4 text-center text-cream/40 text-xs tracking-widest uppercase">
                    <div className="max-w-7xl mx-auto space-y-4">
                        <p className="font-cinzel text-xl font-bold text-gold tracking-[0.3em]">NOIR PUB</p>
                        <p className="text-[10px] text-cream/50">Elevated Drinks • Great Nights • Luxury Atmosphere</p>
                        <p className="pt-4 border-t border-gold/10 text-[9px]">&copy; {new Date().getFullYear()} NOIR PUB. All Rights Reserved.</p>
                    </div>
                </footer>
            );
        };

        // Main App Component
        const App = () => {
            const handleReserveClick = () => {
                const element = document.getElementById('reservation');
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                }
            };

            return (
                <div>
                    <Navigation onReserveClick={handleReserveClick} />
                    <HeroSection onReserveClick={handleReserveClick} />
                    <MenuSection />
                    <AboutSection />
                    <SpecialsSection />
                    <ReservationSection />
                    <ContactSection />
                    <Footer />
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
